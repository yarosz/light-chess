[tools]
java = "temurin-17"
android-sdk = "23.0"

[env]
ANDROID_HOME = "{{env.HOME}}/Library/Android/sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Library/Android/sdk"
# The Chess emulator, selected by AVD name (scripts/chess-emu.sh) on its own port. Never the Reader's LightPhone3 on 5554.
CHESS_AVD = "LightPhone3-chess"
_.path = [
  "{{env.HOME}}/Library/Android/sdk/emulator",
  "{{env.HOME}}/Library/Android/sdk/platform-tools",
]

[tasks.emu]
description = "Boot the LightPhone3-chess AVD on emulator-5556 (writable system and public DNS, every boot; scripts/emulator/RECIPE.md)"
run = [
  "emulator -avd $CHESS_AVD -port 5556 -writable-system -no-snapshot -no-boot-anim -dns-server 1.1.1.1,8.8.8.8",
]

[tasks.tool]
description = "Build (for the emulator's LightOS app), install, and launch on the Chess emulator (emulator-5556)"
run = [
  "scripts/emulator-build.sh ./gradlew :tool:assembleDebug",
  "scripts/chess-emu.sh install -r tool/build/outputs/apk/debug/tool-debug.apk",
  "scripts/chess-emu.sh shell monkey -p com.yarosz.chess 1",
]

[tasks.lightos]
description = "Rebuild + reinstall the LightOS emulator system app on the Chess emulator (keeps uid 1000)"
run = [
  "./gradlew :sdk:emulator:assembleDebug",
  "scripts/chess-emu.sh install -r light-sdk/sdk/emulator/build/outputs/apk/debug/emulator-debug.apk",
]

[tasks.ci]
description = "Local CI: tests, Light-builder simulation, emulator round trip on the Chess AVD; posts signoff statuses"
run = "scripts/ci.sh"

[tasks.domain-drift]
description = "List possible new domain terms since the last domain-pass/* tag (advisory; AGENTS.md)"
run = "scripts/domain-drift.sh"

[tasks.light-build]
description = "Build the committed HEAD the way Light's release builder does (optional arg: SDK dir)"
run = "scripts/light-build.sh"

[tasks.book]
description = "Rebuild the opening Book: stream the pinned Lichess dump (SHA-256 checked, never stored) through the book builder (docs/book.md; --from-filtered to recheck)"
run = "scripts/build-book.sh"

[tasks.bench]
description = "Engine benchmark on a device: install the non-debuggable benchmark build, run the search suite, print P50/P90 (arg: adb serial; -n runs; -d debuggable)"
usage = '''
flag "-n --runs <runs>" help="measured runs (plus one warm-up)" default="5"
flag "-d --debuggable" help="build the same APK debuggable, for comparison"
arg "<serial>" help="adb serial of the device (required)"
'''
run = 'scripts/bench.sh -n "$usage_runs" $([ "${usage_debuggable:-false}" = true ] && echo -d) "$usage_serial"'

[tasks.bench-jvm]
description = "The engine benchmark's search suite on this machine's JVM, for comparison with the phone"
run = [
  "./gradlew --console=plain -q :tool:testBenchmarkUnitTest --tests com.yarosz.chess.bench.BenchSuiteJvmTest --rerun -Dbench.runs=5",
  "python3 scripts/bench-report.py \"ChessBench on the JVM ($(uname -m))\" < tool/build/bench-jvm.txt",
]

[settings]
# Only install what this repo pins; do not auto-install tools from parent directories
task.run_auto_install = false
exec_auto_install = false
