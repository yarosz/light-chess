[tool]
id = "com.yarosz.chess"
label = "Chess"
versionCode = 5
versionName = "0.4.0"
# INTERNET for the Relay only, and only for Games with a friend (ADR 0004, decision log W1). Puzzles and
# Games against the computer never use the network. scripts/release-check.sh relay refuses a release that
# declares it while RelayConfig.URL is empty (W8).
permissions = ["android.permission.INTERNET"]
capabilities = []
orientation = "portrait"
# LightOS on a real Light Phone III. Light builds releases from this committed value, so it must stay
# "com.lightos". Emulator builds substitute the emulator's package at build time (scripts/emulator-build.sh).
serverPackage = "com.lightos"
